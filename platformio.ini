; LilyGo T-Encoder Pro (ESP32-S3-R8, 16MB flash, 8MB OPI PSRAM)
; No dedicated PlatformIO board entry exists for this board yet, so we start
; from the generic esp32-s3-devkitc-1 definition and override flash/PSRAM to
; match this board's actual silicon.
;
; Two upload paths:
;   env:usb - wired, via esptool. Needed for the very first flash of a fresh
;             board (nothing OTA-capable is running yet).
;   env:ota - wireless, via ArduinoOTA, once OTA-capable firmware is already
;             running and the board has joined WiFi. Fill in upload_port with
;             the board's IP (or its mDNS hostname) once that's known.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Matches the actual silicon: ESP32-S3-R8's "R8" means 8MB PSRAM embedded in
; the chip package itself, in OPI (octal SPI) mode by Espressif's own naming
; convention for this variant — confirmed via `esptool`'s own chip-detect
; output ("Embedded PSRAM 8MB"), not just the spec sheet. These overrides
; were removed for a while (2026-08-06) while chasing what looked like a
; PSRAM-caused silent boot hang; turned out to be unrelated (the
; ARDUINO_USB_MODE/Serial-routing issue below — see PROGRESS.md's "Bring-up
; session"). Re-added and boot-tested clean once that was fixed.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
monitor_speed = 115200
; ESP32-S3's Serial defaults to physical UART0 (GPIO43/44), not the native
; USB port, unless explicitly routed there. ARDUINO_USB_MODE picks *which*
; native USB personality: 1 = the simple hardware "JTAG/Serial debug" unit
; (Serial-only, no composite/HID support), 0 = the TinyUSB software OTG
; stack (supports composite CDC+HID, required for USBHIDConsumerControl).
; Started on mode=1 to first prove Serial worked at all; now on mode=0 since
; HID (volume/mic-mute) needs it. Serial still works under mode=0 via
; ARDUINO_USB_CDC_ON_BOOT, just through a different USB descriptor than
; mode=1's "JTAG/serial debug unit" one, so the runtime /dev/ttyACMn path
; differs from the fixed bootloader/flashing path (which is unaffected by
; this setting either way).
build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
; Pinned to the exact version LilyGo's own T-Encoder Pro example (GFX.ino)
; was tested against — SH8601 support and its extended methods
; (Display_Brightness/SetContrast) are new-ish additions to this library,
; worth staying on a known-working version for the first display bring-up
; rather than risking API drift on latest.
lib_deps =
    moononournation/GFX Library for Arduino @ 1.5.0
    lewisxhe/SensorLib @ ^0.4.1

[env:usb]
upload_protocol = esptool
; This path is only valid once the app is running under ARDUINO_USB_MODE=0
; (TinyUSB composite) — that's what actually appears on the wire once an app
; has booted past the ROM stage. The alternate JTAG/serial-debug-unit by-id
; path only exists transiently during the ROM bootloader window (e.g. right
; at power-on) and briefly disappears once a mode=0 app takes over — don't
; hardcode that one for ongoing dev now that we're committed to mode=0.
upload_port = /dev/serial/by-id/usb-Espressif_Systems_Espressif_ESP32-S3-DevKitC-1-N8__8_MB_QD__No_PSRAM__F0F5BD430F7C-if01

[env:ota]
upload_protocol = espota
; IP, not the .local hostname — this environment has no mDNS resolver, so
; hostname lookup fails here even when the board is genuinely reachable.
; Static DHCP reservation set on the router (2026-08-06), so this shouldn't drift.
upload_port = 192.168.1.190
upload_flags =
    ; Set via: OTA_PASSWORD=yourpassword pio run -e ota -t upload
    ; Must match OTA_PASSWORD in include/secrets.h (gitignored), not committed here.
    --auth=${sysenv.OTA_PASSWORD}
    ; This container only publishes port 2222 (SSH) by default. The OTA
    ; protocol needs the board to open a *return* TCP connection back to
    ; whoever initiated the upload to actually transfer the firmware — so
    ; a fixed host_port (rather than espota's normal random pick) plus a
    ; matching Docker port publish are required (see PROGRESS.md for the
    ; container recreate this took). --host_ip is just the local bind
    ; address inside the container (0.0.0.0 = all interfaces) — NOT what
    ; gets advertised to the board. The board infers the return address
    ; from the invitation packet's own source IP (rewritten correctly by
    ; Docker's outbound NAT), so this must stay 0.0.0.0, not the host's
    ; external LAN IP — that was a wrong first guess, corrected 2026-08-06
    ; after "Listen Failed" (0.0.0.0 isn't bindable as a literal address
    ; from inside this container's own network namespace... the *host's*
    ; IP isn't, rather; 0.0.0.0 always is).
    --host_ip=0.0.0.0
    --host_port=8266
